[tool.poetry]
name = "iotsploit-core"
version = "0.0.6"
description = "IoTSploit core library (domain + ports + core) - IoT security testing framework"
authors = ["IoTSploit Team <support@iotsploit.org>"]
readme = "README.md"
license = "GPL-3.0-or-later"
homepage = "https://www.iotsploit.org/"
repository = "https://github.com/TKXB/iotsploit"
documentation = "https://www.iotsploit.org/"
keywords = ["iot", "security", "testing", "pentest", "vulnerability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Topic :: Security",
    "Topic :: System :: Hardware",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{ include = "iotsploit_core", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pluggy = "^1.3.0"
dataclasses-json = "^0.6.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
