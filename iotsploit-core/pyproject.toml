[tool.poetry]
name = "iotsploit-core"
version = "0.1.0"
description = "IoTSploit core library (domain + ports + core), extracted from zeekr_sat_main"
authors = ["IoTSploit Team <devnull@example.com>"]
readme = "README.md"
packages = [{ include = "iotsploit_core", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pluggy = "^1.3.0"
dataclasses-json = "^0.6.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]


