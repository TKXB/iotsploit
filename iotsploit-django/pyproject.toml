[tool.poetry]
name = "iotsploit-django"
version = "0.0.8"
description = "IoTSploit Django ring package (HTTP/WS/ORM + composition root)"
authors = ["IoTSploit Team <support@iotsploit.org>"]
readme = "README.md"
license = "GPL-3.0-or-later"
homepage = "https://www.iotsploit.org/"
repository = "https://github.com/TKXB/iotsploit"
documentation = "https://www.iotsploit.org/"
keywords = ["iot", "security", "testing", "pentest", "django"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Topic :: Security",
    "Topic :: System :: Hardware",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{ include = "iotsploit_django", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
iotsploit-core = "*"
iotsploit-priv = "*"
iotsploit-protocols = "*"
iotsploit-platforms = { version = "*", optional = true }
Django = ">=4.2,<5.0"
channels = ">=4.0"
celery = { version = ">=5.3", optional = true }
redis = { version = ">=5.0", optional = true }
channels-redis = { version = ">=4.1", optional = true }
daphne = ">=4.0"
django-extensions = ">=3.2"
django-cors-headers = ">=4.0"
django-csp = ">=3.7,<4.0"
mistune = ">=3.0"
colorlog = ">=6.8"
SQLAlchemy = ">=2.0"
netifaces = ">=0.11"
psutil = ">=5.9"
requests = ">=2.31"
cryptography = ">=41.0"
pydantic = ">=2.0"
aiohttp = ">=3.9"
asgiref = ">=3.7"
paramiko = ">=3.0"
smbus2 = ">=0.4"
pyusb = ">=1.2"

[tool.poetry.extras]
platforms = ["iotsploit-platforms"]
distributed = ["celery", "redis", "channels-redis"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
