[tool.poetry]
name = "iotsploit-django"
version = "0.1.0"
description = "IoTSploit Django ring package (HTTP/WS/ORM/Celery + composition root)"
authors = ["IoTSploit Team <devnull@example.com>"]
readme = "README.md"
packages = [{ include = "iotsploit_django", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

# NOTE:
# - 该包的运行依赖（Django/channels/celery/redis 等）当前由仓库根 pyproject 管理。
# - 这里保持最小依赖，避免与你现有环境发生版本冲突。

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]


