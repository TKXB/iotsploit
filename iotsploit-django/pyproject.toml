[tool.poetry]
name = "iotsploit-django"
version = "0.0.3"
description = "IoTSploit Django ring package (HTTP/WS/ORM/Celery + composition root)"
authors = ["IoTSploit Team <support@iotsploit.org>"]
readme = "README.md"
license = "GPL-3.0-or-later"
homepage = "https://www.iotsploit.org/"
repository = "https://github.com/TKXB/iotsploit"
documentation = "https://www.iotsploit.org/"
keywords = ["iot", "security", "testing", "pentest", "django"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Topic :: Security",
    "Topic :: System :: Hardware",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{ include = "iotsploit_django", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
iotsploit-core = "^0.0.1"
iotsploit-platforms = { version = "^0.0.1", optional = true }
Django = ">=4.2,<5.0"
channels = ">=4.0"
celery = ">=5.3"
redis = ">=5.0"
channels-redis = ">=4.1"
daphne = ">=4.0"
django-extensions = ">=3.2"
django-cors-headers = ">=4.0"
django-csp = ">=3.7"
mistune = ">=3.0"
colorlog = ">=6.8"
SQLAlchemy = ">=2.0"
netifaces = ">=0.11"
psutil = ">=5.9"
requests = ">=2.31"
cryptography = ">=41.0"
pydantic = ">=2.0"
aiohttp = ">=3.9"
asgiref = ">=3.7"
elevate = ">=0.1"
pwntools = ">=4.11"
bluepy = { version = ">=1.3", optional = true }
pywifi = { version = ">=1.1", optional = true }
smbus2 = { version = ">=0.4", optional = true }
pyusb = { version = ">=1.2", optional = true }

[tool.poetry.extras]
platforms = ["iotsploit-platforms"]
bluetooth = ["bluepy"]
wifi = ["pywifi"]
i2c = ["smbus2"]
usb = ["pyusb"]
hardware = ["bluepy", "pywifi", "smbus2", "pyusb"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
