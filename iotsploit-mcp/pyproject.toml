[tool.poetry]
name = "iotsploit-mcp"
version = "0.1.0"
description = "IoTSploit MCP runtime (FastMCP stdio server + WebSocket bridge), framework-free outer ring."
authors = ["IoTSploit Team <devnull@example.com>"]
readme = "README.md"
packages = [{ include = "iotsploit_mcp", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
mcp = "^1.9.4"
websockets = "^12.0"
requests = "^2.31.0"
nest-asyncio = "^1.6.0"
iotsploit-core = "^0.1.0"

[tool.poetry.scripts]
iotsploit-mcp = "iotsploit_mcp.cli:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"


