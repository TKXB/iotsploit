# OpenOCD config for FT2232 + Lattice ECP5 FPGA JTAG scan
# FT2232H interface (VID:PID 0403:6010, serial FT2232HL)

adapter driver ftdi
ftdi_vid_pid 0x0403 0x6010
ftdi_serial "FT2232HL"

# Use channel B (matches project's ft2232_b cable setting)
ftdi_channel 1

# Standard FT2232H JTAG pinout (BDBUS):
#   BDBUS0 = TCK (output)
#   BDBUS1 = TDI (output)
#   BDBUS2 = TDO (input)
#   BDBUS3 = TMS (output)
ftdi_layout_init 0x0008 0x000b

# Slow JTAG clock for initial scan (safety)
adapter speed 1000

# Use JTAG transport
transport select jtag

# Define ECP5 JTAG TAP
# IDCODE 0x41111043 = Lattice ECP5 LFE5U-25F
# IR length = 8 bits for ECP5
jtag newtap ecp5 tap -irlen 8 -expected-id 0x41111043

# Initialize adapter - this scans the JTAG chain
init

# Print JTAG chain info
jtag names
shutdown
