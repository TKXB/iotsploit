worker_processes auto;
pid /run/iotsploit-nginx/nginx.pid;
error_log /app/logs/nginx/error.log;

events {
    worker_connections 768;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    access_log /app/logs/nginx/access.log;
    client_body_temp_path /var/cache/iotsploit-nginx/client;
    proxy_temp_path /var/cache/iotsploit-nginx/proxy;
    fastcgi_temp_path /var/cache/iotsploit-nginx/fastcgi;
    uwsgi_temp_path /var/cache/iotsploit-nginx/uwsgi;
    scgi_temp_path /var/cache/iotsploit-nginx/scgi;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
