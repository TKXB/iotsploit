[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
nodaemon=true
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# Redis service
[program:redis]
command=redis-server /etc/redis/redis.conf
autostart=true
autorestart=true
startretries=3
user=redis
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis_error.log
priority=100

# Django/Python backend
[program:django]
command=python manage.py runserver --noreload 0.0.0.0:8888
directory=/app
autostart=true
autorestart=true
startretries=3
user=www-data
environment=DJANGO_SETTINGS_MODULE="iotsploit_django.settings.prod",PYTHONPATH="/app"
stdout_logfile=/var/log/supervisor/django.log
stderr_logfile=/var/log/supervisor/django_error.log
priority=200

# Daphne WebSocket server
[program:daphne]
command=python -m daphne -b 0.0.0.0 -p 9999 iotsploit_django.asgi:application
directory=/app
autostart=true
autorestart=true
startretries=3
user=www-data
environment=DJANGO_SETTINGS_MODULE="iotsploit_django.settings.prod",PYTHONPATH="/app"
stdout_logfile=/var/log/supervisor/daphne.log
stderr_logfile=/var/log/supervisor/daphne_error.log
priority=200

# Celery worker (if needed)
[program:celery]
command=python -m celery -A iotsploit_django.tasks.celery_app worker --loglevel=info
directory=/app
autostart=true
autorestart=true
startretries=3
user=www-data
environment=DJANGO_SETTINGS_MODULE="iotsploit_django.settings.prod",PYTHONPATH="/app"
stdout_logfile=/var/log/supervisor/celery.log
stderr_logfile=/var/log/supervisor/celery_error.log
priority=200

# Nginx web server
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
user=root
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_error.log
priority=300

# Group all services
[group:sat-services]
programs=redis,django,daphne,celery,nginx
priority=999 