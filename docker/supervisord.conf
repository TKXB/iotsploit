[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
nodaemon=true
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:privd]
command=/usr/local/libexec/iotsploit-run-cap admin /usr/local/libexec/iotsploit-privd
autostart=true
autorestart=true
startretries=3
user=root
stdout_logfile=/var/log/supervisor/privd.log
stderr_logfile=/var/log/supervisor/privd_error.log
priority=100

# One ASGI process serves HTTP and WebSockets on loopback.
[program:daphne]
command=/usr/local/libexec/iotsploit-run-cap raw python -m daphne -e tcp:8888:interface=127.0.0.1 -e tcp:9999:interface=127.0.0.1 iotsploit_django.asgi:application
directory=/app
autostart=true
autorestart=true
startretries=3
user=root
environment=DJANGO_SETTINGS_MODULE="iotsploit_django.settings.prod",PYTHONPATH="/app"
stdout_logfile=/var/log/supervisor/daphne.log
stderr_logfile=/var/log/supervisor/daphne_error.log
priority=200

# Nginx web server
[program:nginx]
command=/usr/local/libexec/iotsploit-run-cap bind /usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
user=root
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_error.log
priority=300

# Group all services
[group:sat-services]
programs=privd,daphne,nginx
priority=999
