name: Firmware fuzz gate

# Trusted rig jobs are explicitly dispatched; normal local commits need no rig.
on:
  workflow_dispatch:
    inputs:
      ui_repository:
        description: UI repository (owner/name)
        required: true
      ui_sha:
        description: Full candidate UI commit SHA
        required: true
      firmware_sha:
        description: Optional full firmware commit SHA override
        required: false
      candidate_manifest:
        description: Absolute path to the manifest generated by the rig candidate build
        required: true
      rig_inventory:
        description: Absolute path to the rig bindings JSON
        required: true
      candidate_build:
        description: Absolute path to the trusted rig build script (receives UI and firmware paths)
        required: true

concurrency:
  group: firmware-fuzz-rig
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hardware:
    runs-on: [self-hosted, firmware-fuzz]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: python
      - name: Validate immutable candidate inputs
        env:
          UI_SHA: ${{ inputs.ui_sha }}
          FIRMWARE_SHA: ${{ inputs.firmware_sha }}
        run: |
          [[ "$UI_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ -z "$FIRMWARE_SHA" || "$FIRMWARE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.ui_repository }}
          ref: ${{ inputs.ui_sha }}
          submodules: recursive
          path: ui
      - name: Resolve firmware override
        if: inputs.firmware_sha != ''
        env:
          FIRMWARE_SHA: ${{ inputs.firmware_sha }}
        working-directory: ui/third_party/iotsploit-usb
        run: |
          git fetch origin "$FIRMWARE_SHA"
          git checkout --detach "$FIRMWARE_SHA"
          git submodule update --init --recursive
      - name: Install application dependencies
        working-directory: python
        run: poetry install --no-interaction
      - name: Build candidate with preprovisioned rig toolchains
        env:
          CANDIDATE_BUILD: ${{ inputs.candidate_build }}
        run: '"$CANDIDATE_BUILD" "$GITHUB_WORKSPACE/ui" "$GITHUB_WORKSPACE/ui/third_party/iotsploit-usb"'
      - name: Flash and fuzz required matrix
        working-directory: python
        env:
          MANIFEST: ${{ inputs.candidate_manifest }}
          RIG_INVENTORY: ${{ inputs.rig_inventory }}
        run: |
          poetry run python tools/hardware/firmware_fuzz_gate.py \
            --rig "$RIG_INVENTORY" --manifest "$MANIFEST" \
            --ui-root "$GITHUB_WORKSPACE/ui" \
            --firmware-root "$GITHUB_WORKSPACE/ui/third_party/iotsploit-usb" \
            --flasher "$GITHUB_WORKSPACE/ui/firmware/target/debug/firmware-flasher" \
            --flash --iterations 128 --output "$GITHUB_WORKSPACE/results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-fuzz-evidence
          path: results
          if-no-files-found: error
