name: Cross-platform Python

on:
  push:
  pull_request:

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgirepository1.0-dev libcairo2-dev libdbus-1-dev gir1.2-nm-1.0 pkg-config
      - run: python -m pip install poetry==2.0.1
      - run: poetry install
      # Same runner a developer invokes locally, narrowed to the markers a
      # runner with no hardware and no Redis can honestly execute.
      - run: poetry run python tools/testing/run_gate.py -- -m "(unit or contract) and not hardware and not service and not interactive"
      # CI-only: builds ten wheels and a virtualenv per package, so it is too
      # slow for the commit gate. This is what catches a package that resolves
      # at the workspace root but not on its own.
      - run: poetry run python tools/testing/test-wheel-installs.py

  linux-full-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: sudo apt-get update && sudo apt-get install -y libgirepository1.0-dev libcairo2-dev libdbus-1-dev gir1.2-nm-1.0 pkg-config
      - run: python -m pip install poetry==2.0.1
      - run: poetry install
      - run: tools/testing/test-python-full.sh
