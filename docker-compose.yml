services:
  sat-toolkit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sat-toolkit
    ports:
      - "80:80"          # Web UI (Nginx)
    volumes:
      # Persistent data
      - sat_data:/app/data
      - sat_logs:/app/logs
      - sat_uploads:/app/uploads
      # Development mode (uncomment for development)
      # - ./:/app
      # - /app/ui/build
    environment:
      - DJANGO_SETTINGS_MODULE=iotsploit_django.settings.prod
      - IOTSPLOIT_RUNTIME=${IOTSPLOIT_RUNTIME:-local}
      - IOTSPLOIT_DATABASE_PATH=/app/data/db.sqlite3
      - PYTHONPATH=/app
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost}
    cap_drop: [ALL]
    # These bootstrap capabilities exist only so PID 1 can set the final UID
    # and capability sets; the root-owned launcher removes them from every child.
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE, SETUID, SETGID, SETPCAP]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - sat-network

  redis:
    image: redis:7-alpine
    profiles: ["distributed"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - sat-network

  celery:
    build: .
    profiles: ["distributed"]
    command: /usr/local/libexec/iotsploit-run-cap raw python -m celery -A iotsploit_django.tasks.celery_app:app worker --loglevel=info -Q celery
    cap_drop: [ALL]
    cap_add: [NET_RAW, SETUID, SETGID, SETPCAP]
    environment: &distributed-environment
      DJANGO_SETTINGS_MODULE: iotsploit_django.settings.prod
      IOTSPLOIT_RUNTIME: distributed
      IOTSPLOIT_DATABASE_PATH: /app/data/db.sqlite3
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    depends_on: [redis]
    volumes:
      - sat_data:/app/data
      - sat_logs:/app/logs
      - sat_uploads:/app/uploads
    networks: [sat-network]

  celery-interactive:
    build: .
    profiles: ["distributed"]
    command: /usr/local/libexec/iotsploit-run-cap raw python -m celery -A iotsploit_django.tasks.celery_app:app worker --loglevel=info -Q interactive -c 1 -n interactive@%h
    cap_drop: [ALL]
    cap_add: [NET_RAW, SETUID, SETGID, SETPCAP]
    environment: *distributed-environment
    depends_on: [redis]
    volumes:
      - sat_data:/app/data
      - sat_logs:/app/logs
      - sat_uploads:/app/uploads
    networks: [sat-network]

  celery-streaming:
    build: .
    profiles: ["distributed"]
    command: /usr/local/libexec/iotsploit-run-cap raw python -m celery -A iotsploit_django.tasks.celery_app:app worker --loglevel=info -Q streaming -c 1 -n streaming@%h
    cap_drop: [ALL]
    cap_add: [NET_RAW, SETUID, SETGID, SETPCAP]
    environment: *distributed-environment
    depends_on: [redis]
    volumes:
      - sat_data:/app/data
      - sat_logs:/app/logs
      - sat_uploads:/app/uploads
    networks: [sat-network]

  # Optional: Database container (if you want external database)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: sat-postgres
  #   environment:
  #     POSTGRES_DB: iotsploit_django
  #     POSTGRES_USER: sat_user
  #     POSTGRES_PASSWORD: sat_password
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped
  #   networks:
  #     - sat-network

volumes:
  sat_data:
    driver: local
  sat_logs:
    driver: local
  sat_uploads:
    driver: local
  redis_data:
    driver: local
  # postgres_data:
  #   driver: local

networks:
  sat-network:
    driver: bridge
