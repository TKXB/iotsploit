[tool.poetry]
name = "iotsploit-platforms"
version = "0.0.7"
description = "IoTSploit platform-specific adapters (WiFi, Input, SSH backends)"
authors = ["IoTSploit Team <support@iotsploit.org>"]
readme = "README.md"
license = "GPL-3.0-or-later"
homepage = "https://www.iotsploit.org/"
repository = "https://github.com/TKXB/iotsploit"
documentation = "https://www.iotsploit.org/"
keywords = ["iot", "security", "testing", "pentest", "wifi", "platform"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Topic :: Security",
    "Topic :: System :: Hardware",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{ include = "iotsploit_platforms", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
iotsploit-core = "*"
# Linux WiFi backend dependencies
# Using NetworkManager (libnm) via PyGObject
# System dependencies required: python3-gi gir1.2-nm-1.0
PyGObject = "<3.51"
dbus-python = "^1.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
