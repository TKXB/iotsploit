[tool.poetry]
name = "sat-toolkit"
version = "0.0.6"
description = "Iotsploit Toolkit"
authors = ["tk"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
cmd2 = "2.4.3"
colorlog = "6.8.2"
cryptography = "43.0.0"
Django = "4.2.14"
django-cors-headers = "4.4.0"
django-extensions = "3.2.3"
django_csp = "3.8"
channels = "4.1.0"
mistune = "3.0.2"
SQLAlchemy = "2.0.34"
pluggy = "1.5.0"
pyftdi = "0.55.4"
pylink-square = "^2.0.0"
daphne = "4.1.2"
netifaces = "0.11.0"
pywifi = "1.1.12"
pwntools = "4.12.0"
elevate = "0.1.3"
celery = "^5.3.6"
redis = "^5.0.1"
channels_redis = "^4.1.0"
esptool = "4.8.1"
dataclasses-json = "0.6.7"
# Standalone extracted core package (scheme B: app imports iotsploit_core.*)
iotsploit-core = { path = "iotsploit-core", develop = true }
# Platform-specific adapters (WiFi, Input, SSH backends)
iotsploit-platforms = { path = "iotsploit-platforms", develop = true }
# MCP outer-ring package (PyPI-style, src-layout)
iotsploit-mcp = { path = "iotsploit-mcp", develop = true }
# CLI shell (console + commands)
iotsploit-cli = { path = "iotsploit-cli", develop = true }
pyudev = "0.24.3"
facedancer = "^3.0.0"
# AI and MCP dependencies
openai = "^1.35.0"
anthropic = "^0.28.0"
google-generativeai = "^0.7.0"
mcp = "^1.9.4"
nest-asyncio = "^1.6.0"
# ... (other dependencies)

[tool.poetry.group.dev.dependencies]
iotsploit-exploits = {path = "iotsploit-exploits", develop = true}
iotsploit-drivers = {path = "iotsploit-drivers", develop = true}
iotsploit-django = {path = "iotsploit-django", develop = true}
iotsploit-fuzzer = {path = "iotsploit-fuzzer", develop = true}
ruff = "^0.15.20"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "primary"
