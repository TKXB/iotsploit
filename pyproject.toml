[tool.poetry]
name = "sat-toolkit"
version = "0.0.6"
description = "Iotsploit Toolkit"
authors = ["tk"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
cmd2 = "2.4.3"
prompt-toolkit = "3.0.48"
colorlog = "6.8.2"
cryptography = "43.0.0"
Django = "4.2.14"
django-cors-headers = "4.4.0"
django-extensions = "3.2.3"
django_csp = "3.8"
channels = "4.1.0"
mistune = "3.0.2"
SQLAlchemy = "2.0.34"
pluggy = "1.5.0"
pyftdi = "0.55.4"
pylink-square = "^2.0.0"
daphne = "4.1.2"
netifaces = "0.11.0"
elevate = "0.1.3"
celery = "^5.3.6"
redis = "^5.0.1"
channels_redis = "^4.1.0"
esptool = "4.8.1"
dataclasses-json = "0.6.7"
# Standalone extracted core package (scheme B: app imports iotsploit_core.*)
iotsploit-core = { path = "iotsploit-core", develop = true }
# Platform-specific adapters (WiFi, Input, SSH backends)
iotsploit-platforms = { path = "iotsploit-platforms", develop = true }
# Wire-protocol clients (SOME/IP, DoIP/UDS) — no Django, no environment
iotsploit-protocols = { path = "iotsploit-protocols", develop = true }
# MCP outer-ring package (PyPI-style, src-layout)
iotsploit-mcp = { path = "iotsploit-mcp", develop = true }
# CLI shell (console + commands)
iotsploit-cli = { path = "iotsploit-cli", develop = true }
pyudev = "0.24.3"
facedancer = "^3.0.0"
# AI and MCP dependencies
openai = "^1.35.0"
anthropic = "^0.28.0"
google-generativeai = "^0.7.0"
mcp = "^1.9.4"
nest-asyncio = "^1.6.0"
# ... (other dependencies)

[tool.poetry.group.dev.dependencies]
iotsploit-exploits = {path = "iotsploit-exploits", develop = true}
iotsploit-drivers = {path = "iotsploit-drivers", develop = true}
iotsploit-django = {path = "iotsploit-django", develop = true}
iotsploit-fuzzer = {path = "iotsploit-fuzzer", develop = true}
ruff = "^0.15.20"
pytest = ">=8.0"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers"
testpaths = [
    "iotsploit-core/tests",
    "iotsploit-protocols/tests",
    "iotsploit-django/tests",
    "iotsploit-django/src/iotsploit_django/tests",
    "iotsploit-fuzzer/tests",
    "iotsploit-mcp/tests",
    "iotsploit-cli/tests",
    "iotsploit-exploits/tests",
]
markers = [
    "unit: isolated, deterministic behavior",
    "integration: behavior involving multiple software components",
    "contract: HTTP, WebSocket, MCP, entry-point, or plugin compatibility",
    "django: behavior requiring Django initialization or its test database",
    "service: behavior requiring Redis or another external service",
    "hardware: behavior requiring a physical device",
    "interactive: behavior requiring human input",
]

[tool.ruff]
target-version = "py310"
line-length = 120

# Baseline: the existing codebase has pre-existing violations in the rules
# listed below. New code must not introduce NEW categories of violations.
# Remove individual entries from this list as the corresponding violations
# are fixed.
[tool.ruff.lint]
ignore = [
    "E402",  # module-import-not-at-top-of-file (Django/gi setup ordering)
    "E711",  # none-comparison (== None)
    "E712",  # true-false-comparison (== True / == False)
    "E722",  # bare-except
    "E701",  # multiple-statements-on-one-line-colon
    "F403",  # undefined-local-with-import-star (from x import *)
    "F405",  # undefined-local-with-import-star-usage
    "F821",  # undefined-name (DBus type hints in wifi_backend)
    "F522",  # string-dot-format-extra-named-arguments
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
priority = "primary"
